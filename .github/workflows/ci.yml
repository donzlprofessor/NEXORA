name: NEXORA checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: nexora
          POSTGRES_DB: nexora_ci
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U nexora -d nexora_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m unittest discover -s backend -p 'test_*.py'
      - name: Apply additive migrations on isolated CI PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://nexora@127.0.0.1:5432/nexora_ci
        run: alembic upgrade head
      - name: Account integration suite against PostgreSQL
        env:
          NEXORA_TEST_POSTGRES_URL: postgresql+psycopg://nexora@127.0.0.1:5432/nexora_ci
        run: python -m unittest discover -s backend -p 'test_accounts.py'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit -- --run
      - run: npm run lint
      - run: npm run build
